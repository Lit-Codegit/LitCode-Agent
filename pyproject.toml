[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "litcode-agent"
version = "0.1.0"
description = "A small, transparent coding agent built from first principles."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "LitCode-Agent contributors" }]
dependencies = [
  "openai>=2.0,<3",
  "pyyaml>=6.0,<7",
  "rich>=14.0,<15",
  "textual>=6.0,<8",
  "tzdata>=2025.2; sys_platform == 'win32'",
  "tzlocal>=5.3,<6; sys_platform == 'win32'",
]

[project.scripts]
litcode = "litcode_agent.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.0,<10",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/litcode_agent"]

[tool.hatch.build.targets.sdist]
include = [
  "/.litcode/README.md",
  "/.litcode/settings.json",
  "/docs",
  "/src/litcode_agent",
  "/tests",
  "/CONTEXT.md",
  "/README.md",
  "/README.txt",
  "/pyproject.toml",
  "/uv.lock",
]
