[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "litcode-agent"
version = "0.1.0"
description = "A small, transparent coding agent built from first principles."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "LitCode-Agent contributors" }]
dependencies = [
  "openai>=2.0,<3",
  "rich>=14.0,<15",
  "textual>=6.0,<8",
]

[project.scripts]
litcode = "litcode_agent.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.0,<10",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/litcode_agent"]
